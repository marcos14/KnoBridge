# Serves the admin panel (SPA) and forwards API calls to the backend on the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: same origin for the browser, so no CORS. `api` is the compose service name.
    location /v1/ {
        # Resolve `api` per request through Docker's embedded DNS, so nginx starts (and serves the
        # panel) even when the API container is not up yet; calls then fail with 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming answers (SSE) must reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # The embeddable widget (docs/specs/widget.md, "Onde o JS é servido"): any site loads it, so
    # CORS is open (no cookie involved); the path is stable, so a short cache, never immutable;
    # a missing file is a 404, never the SPA fallback.
    location /widget/ {
        types { }
        default_type text/javascript;
        charset utf-8;
        charset_types text/javascript;
        # About a third of the size on the wire (the budget of the spec is measured with gzip).
        gzip on;
        gzip_vary on;
        gzip_types text/javascript;
        add_header Cache-Control "public, max-age=300" always;
        add_header Access-Control-Allow-Origin "*" always;
        add_header Cross-Origin-Resource-Policy "cross-origin" always;
        add_header X-Content-Type-Options "nosniff" always;
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
