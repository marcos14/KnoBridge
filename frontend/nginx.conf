# Serves the admin panel (SPA) and forwards API calls to the backend on the same origin.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    # API: same origin for the browser, so no CORS. `api` is the compose service name.
    location /v1/ {
        # Resolve `api` per request through Docker's embedded DNS, so nginx starts (and serves the
        # panel) even when the API container is not up yet; calls then fail with 502.
        resolver 127.0.0.11 valid=30s ipv6=off;
        set $api_upstream http://api:8000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Streaming answers (SSE) must reach the browser as they are produced.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }

    # Hashed bundles never change: cache them for a long time.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # SPA fallback: client-side routes are resolved by React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
