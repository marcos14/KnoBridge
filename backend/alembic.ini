# Alembic configuration. The database URL is NOT set here: migrations/env.py reads it from
# KNOBRIDGE_DATABASE_URL through knobridge.core.settings (tests inject it via config.attributes).

[alembic]
script_location = %(here)s/migrations
prepend_sys_path = .
# Revision files named by date so `ls migrations/versions` reads in order.
file_template = %%(year)d%%(month).2d%%(day).2d_%%(rev)s_%%(slug)s
path_separator = os

[post_write_hooks]
# New revisions come out lint-clean: drop unused template imports, sort, then format.
hooks = ruff_fix, ruff_format
ruff_fix.type = exec
ruff_fix.executable = ruff
ruff_fix.options = check --fix REVISION_SCRIPT_FILENAME
ruff_format.type = exec
ruff_format.executable = ruff
ruff_format.options = format REVISION_SCRIPT_FILENAME

# Alembic's own messages; the API uses the JSON logging from knobridge.core.logging.
[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
