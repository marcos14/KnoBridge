[project]
name = "knobridge-scripts"
version = "0.1.0"
description = "Repository automation for KnoBridge (CI checks)."
requires-python = ">=3.12"
license = "Apache-2.0"
dependencies = ["pyyaml>=6.0.2"]

[dependency-groups]
dev = [
    "pyright>=1.1.390",
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "ruff>=0.8",
    "types-PyYAML>=6.0.12",
]

[tool.uv]
# Plain scripts, not an installable package.
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "B",   # bugbear
    "UP",  # pyupgrade
    "SIM", # simplify
    "RUF", # ruff-specific
    "C4",  # comprehensions
    "PTH", # use pathlib
    "PT",  # pytest style
    "N",   # naming
    "S",   # bandit (security)
    "T20", # print statements
    "ANN", # annotations
]

[tool.ruff.lint.per-file-ignores]
# These modules are CLIs: writing to stdout is their job, and they shell out to git on purpose.
"check_*.py" = ["T201", "S603", "S607"]
# CLI of the synthetic data generator: it prints a one-line summary.
"synthetic_tickets/cli.py" = ["T201"]
"tests/**" = ["S101", "S603", "S607"]

[tool.ruff.format]
quote-style = "double"

[tool.pyright]
include = ["."]
exclude = [".venv", "**/__pycache__"]
pythonVersion = "3.12"
typeCheckingMode = "strict"
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
markers = ["repo: runs against the real repository checkout"]
addopts = "--cov --cov-branch --cov-report=term-missing --cov-fail-under=95"

[tool.coverage.run]
source = ["."]
omit = ["tests/*", ".venv/*"]
branch = true

[tool.coverage.report]
show_missing = true
